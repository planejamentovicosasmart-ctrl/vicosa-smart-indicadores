services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indicadores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - indicadores_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indicadores"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  indicadores_pg:
