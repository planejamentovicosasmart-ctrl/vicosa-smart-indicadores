services:
  - type: web
    name: vicosa-smart-indicadores
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run bootstrap --prefix server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: TAVILY_API_KEY
        sync: false
      - key: AGENT_MAX_INDICATORS
        value: "8"
      - key: BASIC_AUTH_USER
        value: vicosasmart
      - key: BASIC_AUTH_PASSWORD
        sync: false
