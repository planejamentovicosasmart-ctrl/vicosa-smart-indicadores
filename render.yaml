services:
  - type: web
    name: vicosa-smart-indicadores
    runtime: node
    region: oregon
    buildCommand: npm run install:all && npm run build
    preDeployCommand: npm run db:push --prefix server && npm run seed --prefix server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: TAVILY_API_KEY
        sync: false
      - key: AGENT_MAX_INDICATORS
        value: "8"
      - key: BASIC_AUTH_USER
        value: vicosasmart
      - key: BASIC_AUTH_PASSWORD
        sync: false

  - type: cron
    name: vicosa-smart-indicadores-agent-diario
    runtime: node
    region: oregon
    schedule: "0 9 * * *"
    buildCommand: npm install --prefix server && npm run prisma:generate --prefix server
    startCommand: npm run agent
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: TAVILY_API_KEY
        sync: false
      - key: AGENT_MAX_INDICATORS
        value: "8"
